<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensual Control — пульт для управления вибратором</title>
<meta name="description" content="Sensual Control — приложение-пульт для управления вибратором: с телефона, на расстоянии, со своими ритмами. Приватно и просто.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0410;
    --bg-2:#140820;
    --panel:#1a0c26;
    --panel-2:#22103033;
    --line:rgba(199,140,255,.14);
    --line-str:rgba(199,140,255,.26);
    --accent:#c24bff;
    --accent-2:#ff4bd6;
    --glow:rgba(194,75,255,.45);
    --cream:#f2e9f7;
    --mute:#b299c9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--cream);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{letter-spacing:-.02em;font-weight:800}

  /* HEADER */
  header{position:sticky;top:0;z-index:60;background:rgba(12,4,16,.74);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:72px}
  .logo{height:40px;width:auto;display:block;filter:drop-shadow(0 0 14px var(--glow))}
  .nav-right{display:flex;align-items:center;gap:24px}
  .nav-links{display:none;gap:30px}
  .nav-links a{color:var(--mute);font-size:15px;transition:.2s}
  .nav-links a:hover{color:var(--cream)}
  @media(min-width:880px){.nav-links{display:flex}}
  .age{font-size:12px;font-weight:700;color:var(--accent-2);border:1px solid var(--line-str);border-radius:999px;padding:4px 10px}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;gap:10px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;border:none;border-radius:999px;padding:15px 30px;transition:transform .18s,box-shadow .2s,background .2s,border-color .2s}
  .btn svg{width:18px;height:18px}
  .btn-main{background:linear-gradient(100deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 30px var(--glow)}
  .btn-main:hover{transform:translateY(-3px);box-shadow:0 12px 40px var(--glow)}
  .btn-line{background:transparent;color:var(--cream);border:1px solid var(--line-str);padding:14px 26px}
  .btn-line:hover{border-color:var(--accent);color:var(--accent)}

  /* КНОПКА СКАЧИВАНИЯ APK */
  .btn-download {
    background: linear-gradient(100deg, #c24bff, #ff4bd6);
    color: #fff;
    box-shadow: 0 8px 30px var(--glow);
    font-size: 16px;
    padding: 15px 32px;
    border-radius: 999px;
    font-weight: 700;
    transition: all .2s;
  }
  .btn-download:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px var(--glow);
    background: linear-gradient(100deg, #e13dff, #ff4bd6);
  }

  /* HERO */
  .hero{position:relative;padding:76px 0 72px}
  .hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(620px 320px at 78% 20%,rgba(194,75,255,.18),transparent 70%),radial-gradient(500px 300px at 15% 60%,rgba(255,75,214,.1),transparent 70%)}
  .hero-grid{display:grid;gap:48px;align-items:center}
  @media(min-width:900px){.hero-grid{grid-template-columns:1.02fr .98fr}}
  .hero .eyebrow{color:var(--accent-2);font-weight:600;font-size:18px;margin-bottom:20px;letter-spacing:.3px}
  .hero h1{font-size:clamp(40px,6.6vw,74px);line-height:1.02;margin-bottom:22px}
  .hero h1 span{background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .lede{font-size:clamp(16px,2.2vw,19px);color:var(--mute);max-width:470px;margin-bottom:34px}
  .hero-cta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .hero .mini{margin-top:20px;color:var(--mute);font-size:14px}

  /* HERO VISUAL */
  .stage{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto}
  .orb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:124px;height:124px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-2),var(--accent) 55%,#7a1fb0 100%);box-shadow:0 0 70px var(--glow)}
  .orb::after{content:"";position:absolute;inset:0;display:grid;place-items:center}
  .heart{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;z-index:2}
  .wave{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:1.5px solid var(--accent);border-radius:50%;opacity:0;animation:wave 3.6s ease-out infinite}
  .wave.w2{animation-delay:1.2s}.wave.w3{animation-delay:2.4s}
  @keyframes wave{0%{width:124px;height:124px;opacity:.6}100%{width:420px;height:420px;opacity:0}}
  .node{position:absolute;width:52px;height:52px;border-radius:16px;background:var(--panel);border:1px solid var(--line-str);display:grid;place-items:center;color:var(--accent)}
  .node svg{width:26px;height:26px}
  .node.phone{top:13%;left:9%}
  .link{position:absolute;top:21%;left:19%;width:40%;height:35%;border-bottom:1.5px dashed var(--line-str);border-left:1.5px dashed var(--line-str);border-radius:0 0 0 44px;opacity:.7}
  @media(prefers-reduced-motion:reduce){.wave{animation:none;opacity:.3}}

  /* SECTIONS */
  section{padding:84px 0}
  .head{max-width:640px;margin-bottom:50px}
  .head.center{margin:0 auto 50px;text-align:center}
  .head h2{font-size:clamp(30px,4.6vw,46px);line-height:1.06;margin-bottom:14px}
  .head p{color:var(--mute);font-size:17px}

  /* FEATURES */
  .feats{display:grid;gap:20px;grid-template-columns:1fr}
  @media(min-width:640px){.feats{grid-template-columns:1fr 1fr}}
  @media(min-width:980px){.feats{grid-template-columns:repeat(3,1fr)}}
  .feat{background:linear-gradient(180deg,var(--bg-2),var(--bg));border:1px solid var(--line);border-radius:22px;padding:30px;transition:border-color .2s}
  .feat:hover{border-color:var(--line-str)}
  .feat .fi{width:46px;height:46px;border-radius:14px;background:rgba(194,75,255,.12);color:var(--accent);display:grid;place-items:center;margin-bottom:18px}
  .feat .fi svg{width:24px;height:24px}
  .feat h3{font-size:20px;font-weight:700;margin-bottom:8px}
  .feat p{color:var(--mute);font-size:15px}

  /* REVIEWS */
  .reviews{display:grid;gap:22px}
  @media(min-width:760px){.reviews{grid-template-columns:repeat(3,1fr)}}
  .quote{border:1px solid var(--line);border-radius:22px;padding:28px;background:var(--bg-2)}
  .quote .ph{font-size:12px;color:var(--accent-2);opacity:.8;margin-bottom:10px}
  .quote p{font-size:17px;line-height:1.5;margin-bottom:18px}
  .quote .by{display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
  .quote .av{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);font-weight:700}
  .quote .by b{font-size:14px}.quote .by small{display:block;color:var(--mute);font-size:12px}

  /* FAQ */
  .faq{max-width:760px}
  .faq details{border-bottom:1px solid var(--line)}
  .faq summary{cursor:pointer;padding:22px 2px;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:20px;align-items:center}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary span.ic{flex:none;width:20px;height:20px;position:relative}
  .faq summary span.ic::before,.faq summary span.ic::after{content:"";position:absolute;background:var(--accent);transition:.25s}
  .faq summary span.ic::before{top:9px;left:1px;right:1px;height:2px}
  .faq summary span.ic::after{left:9px;top:1px;bottom:1px;width:2px}
  .faq details[open] summary span.ic::after{transform:scaleY(0)}
  .faq p{color:var(--mute);font-size:15.5px;padding:0 2px 22px;max-width:650px}

  /* BAND */
  .band{position:relative;text-align:center;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,var(--panel),var(--bg));padding:64px 32px;overflow:hidden}
  .band::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:var(--accent);filter:blur(150px);opacity:.22;top:-100px;left:50%;transform:translateX(-50%)}
  .band h2{position:relative;font-size:clamp(28px,4.6vw,48px);margin-bottom:16px;line-height:1.06}
  .band p{position:relative;color:var(--mute);margin-bottom:30px;font-size:17px}
  .band .btn{position:relative}

  /* FOOTER */
  footer{border-top:1px solid var(--line);margin-top:24px;padding:36px 0}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:13.5px}
  .foot .logo{height:30px;margin-bottom:10px}
  .foot .note{max-width:520px}

  /* MOBILE */
  @media(max-width:600px){
    .hero{padding:48px 0 40px}
    .hero-grid{gap:32px}
    .hero .eyebrow{font-size:15px}
    .hero h1{font-size:clamp(34px,9vw,46px)}
    .hero .lede{font-size:15px;max-width:100%}
    .hero-cta{flex-direction:column;align-items:stretch}
    .hero-cta .btn{justify-content:center;width:100%}
    .stage{max-width:280px}
    .orb{width:90px;height:90px}
    .heart{width:58px;height:58px}
    @keyframes wave{0%{width:90px;height:90px;opacity:.6}100%{width:290px;height:290px;opacity:0}}
    .node{width:40px;height:40px;border-radius:12px}
    .node svg{width:20px;height:20px}
    .duo{padding:32px 20px}
    .duo .dist{height:140px}
    .duo .pp{width:52px;height:52px}
    section{padding:56px 0}
    .band{padding:44px 20px}
    .btn{font-size:15px;padding:13px 24px}
  }
</style>
</head>
